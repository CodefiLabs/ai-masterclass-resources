version: "3.9"

services:
  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"   # RedisInsight UI
    volumes:
      - redis_data:/data

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    ports:
      - "8888:8888"   # API + MCP endpoint
      - "9999:9999"   # Admin UI (browse memories)
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ollama
      HINDSIGHT_API_LLM_BASE_URL: http://host.docker.internal:11434
    volumes:
      - hindsight_data:/home/hindsight/.pg0
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:
  hindsight_data:
